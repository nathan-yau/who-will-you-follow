<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e9f2e3" />
  <meta name="robots" content="noindex" />
  <title>主持人控制台 · Who Will You Follow?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&family=Chiron+GoRound+TC:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin.css?v=18" />
</head>
<body>
  <header class="top">
    <div class="top__brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#ec8c7b"><ellipse cx="16" cy="21.5" rx="7.6" ry="6.4"/><ellipse cx="7" cy="13.5" rx="3.1" ry="3.8"/><ellipse cx="12.4" cy="7.6" rx="3.1" ry="3.9"/><ellipse cx="19.6" cy="7.6" rx="3.1" ry="3.9"/><ellipse cx="25" cy="13.5" rx="3.1" ry="3.8"/></g></svg>
      <h1>主持人</h1>
    </div>
    <div class="top__right" id="topRight" hidden>
      <span class="sync" id="sync" hidden>連線中斷…</span>
      <span class="stat" title="已加入人數"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3" fill="currentColor"/><path d="M2.5 14c0-3 2.5-5 5.5-5s5.5 2 5.5 5" fill="currentColor"/></svg><b id="joined">0</b></span>
      <span class="stat" title="在線人數"><i class="dot on"></i><b id="online">0</b></span>
      <button class="iconbtn" id="logout" type="button" title="登出" aria-label="登出"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 8l-4 4 4 4M5 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </header>

  <main>
    <!-- login -->
    <section class="login card" id="login" hidden>
      <h2>主持人登入</h2>
      <p>請輸入管理密碼以查看玩家與分配身分。</p>
      <form id="loginForm" autocomplete="on">
        <input type="text" name="username" value="admin" autocomplete="username" hidden />
        <input class="input input--pin" id="pw" type="password" name="password" inputmode="numeric" autocomplete="current-password" placeholder="管理密碼" maxlength="64" required />
        <button class="btn btn--primary" id="loginBtn" type="submit">登入</button>
      </form>
      <p class="login__err" id="loginErr" role="alert"></p>
    </section>

    <!-- dashboard: a stack of collapsible sections (.acc). To add one, copy the markup with a new data-acc id. -->
    <div id="dash" class="stack" hidden>
      <section class="acc" data-acc="players" id="accPlayers">
        <div class="acc__head">
          <button class="acc__toggle" type="button" aria-expanded="true" aria-controls="accPlayersBody">
            <span class="acc__title">玩家管理</span>
            <span class="acc__sum"><b id="sumJoined">0</b> 人 · 領袖 <b id="sumLeaders">0</b>/<span id="sumLeadersMax">4</span> · 支持者 <b id="sumSup">0</b>/<span id="sumSupMax">3</span></span>
            <svg class="acc__chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="acc__tools lockwrap">
            <span class="lock__hint" id="lockHint">先解鎖</span>
            <button class="lock" id="lock" type="button" aria-pressed="false" title="鎖定可避免誤觸"><span id="lockIcon" aria-hidden="true">🔒</span><span id="lockText">已鎖定</span></button>
          </div>
        </div>
        <div class="acc__body" id="accPlayersBody">
          <ul class="warnings" id="warnings"></ul>
          <div class="grid is-locked" id="grid"></div>
          <p class="empty" id="empty" hidden>目前還沒有玩家加入</p>
          <div class="acc__foot">
            <button class="btn btn--primary" id="random" type="button">隨機分配</button>
            <button class="btn btn--ghost" id="clear" type="button">清除角色</button>
            <button class="btn btn--danger" id="reset" type="button">新一場</button>
          </div>
        </div>
      </section>

      <section class="acc" data-acc="reveal" id="accReveal">
        <div class="acc__head">
          <button class="acc__toggle" type="button" aria-expanded="true" aria-controls="accRevealBody">
            <span class="acc__title">身份揭曉</span>
            <span class="acc__sum"><i class="dot" id="rvDot"></i> <span id="rvText">未開始</span> · 已揭曉 <b id="rvDone">0</b>/<span id="rvTotal">0</span></span>
            <svg class="acc__chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="acc__body" id="accRevealBody">
          <p class="tvnote" id="rvNote">開始後，每位玩家的手機會顯示「揭曉我的身份」，TV 只顯示「請看你的手機」（不會顯示任何玩家資料或進度）。</p>
          <div class="rvbar" aria-hidden="true"><i id="rvBar"></i></div>
          <div class="rvlist" id="rvList"></div>
          <div class="acc__foot">
            <button class="btn btn--primary" id="rvStart" type="button">開始身份揭曉</button>
            <button class="btn btn--ghost" id="rvEnd" type="button">結束揭曉</button>
          </div>
        </div>
      </section>

      <section class="acc" data-acc="tv" id="accTv">
        <div class="acc__head">
          <button class="acc__toggle" type="button" aria-expanded="true" aria-controls="accTvBody">
            <span class="acc__title">TV／遊戲</span>
            <span class="acc__sum"><i class="dot" id="phaseDot"></i> <span id="phaseText">等候中</span></span>
            <svg class="acc__chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="acc__body" id="accTvBody">
          <p class="tvnote" id="tvNote">等候中：玩家可在手機按「避開啊／衝過去」玩 TV 上的泡泡大戰。</p>
          <!-- flow: 等候 → 身份揭曉 → Round 1 → 2 → 3. Shown after the reveal stage started, until a round is on the TV.
               All revealed -> one tap; otherwise locked (X / N 已揭曉) and a tap arms 「仍然開始」 (2nd tap within 3 s). -->
          <div class="r1go" id="r1go" hidden>
            <span class="r1go__cnt">已揭曉 <b id="r1Done">0</b> / <span id="r1Total">0</span></span>
            <button class="btn btn--primary r1go__btn" id="goR1" type="button">開始 Round 1</button>
          </div>
          <div class="seg" id="tvSeg" role="group" aria-label="TV 畫面">
            <span class="seg__label">TV 畫面</span>
            <div class="seg__btns">
              <button type="button" class="seg__btn" data-screen="lobby" aria-pressed="true">等候</button>
              <button type="button" class="seg__btn" data-screen="r1" aria-pressed="false" lang="en">Round 1</button>
              <button type="button" class="seg__btn" data-screen="r2" aria-pressed="false" lang="en">Round 2</button>
              <button type="button" class="seg__btn" data-screen="r3" aria-pressed="false" lang="en">Round 3</button>
            </div>
          </div>
          <div class="acc__foot">
            <a class="btn btn--ghost" id="openTv" href="../tv/" target="_blank" rel="noopener">開啟 TV 畫面</a>
            <button class="btn btn--ghost" id="toLobby" type="button">回到等候</button>
            <button class="btn btn--primary" id="startGame" type="button">開始遊戲</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/api.js?v=10"></script>
  <script src="../js/admin.js?v=19"></script>
</body>
</html>
