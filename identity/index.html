<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e9f2e3" />
  <title>身份揭曉 · Who Will You Follow? 你會跟隨誰？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&family=Chiron+GoRound+TC:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=6" />
  <link rel="stylesheet" href="../css/characters.css?v=8" />
  <link rel="stylesheet" href="../css/identity.css?v=7" />
</head>
<body>
  <!-- 身份揭曉: data-state = loading | pre (silhouette + 揭曉) | shown (role card) | wait (calm, 再看一次) -->
  <main class="cs-app id-app" id="app" data-state="loading">
    <div class="cs-stage">
      <div class="cs-bg" aria-hidden="true">
        <div class="cs-meadow"></div>
        <div class="cs-scene cs-scene--top"></div>
        <div class="cs-scene cs-scene--bottom"></div>
        <div class="cs-ground"></div>
      </div>

      <div class="cs-title">
        <header class="title-block">
          <img class="deco spark" src="../assets/img/spark-l.png?v=6" alt="" style="--x:88;--y:206;--w:29" />
          <img class="deco spark" src="../assets/img/spark-r.png?v=6" alt="" style="--x:486;--y:204;--w:26" />
          <h1 id="title" class="title" lang="en" aria-label="Who Will You Follow?">
            <span class="title__line title__line--1" aria-hidden="true"><span class="ch" style="--r:-10.9;--dy:17.6">W</span><span class="ch" style="--r:-7.6;--dy:8.5">h</span><span class="ch" style="--r:-5.3;--dy:4.1">o</span><span class="sp"> </span><span class="ch" style="--r:-1.2;--dy:0.2">W</span><span class="ch" style="--r:1.5;--dy:0.3">i</span><span class="ch" style="--r:2.7;--dy:1.1">l</span><span class="ch" style="--r:4.0;--dy:2.4">l</span><span class="sp"> </span><span class="ch" style="--r:6.9;--dy:7.0">Y</span><span class="ch" style="--r:9.4;--dy:13.1">o</span><span class="ch" style="--r:11.7;--dy:20.1">u</span></span>
            <span class="title__line title__line--2" aria-hidden="true"><span class="ch" style="--r:-2;--dy:0">F</span><span class="ch" style="--r:0;--dy:-1">o</span><span class="ch">l</span><span class="ch">l</span><span class="ch" style="--r:0;--dy:-1">o</span><span class="ch" style="--r:2;--dy:1">w</span><span class="ch" style="--r:8;--dy:3">?</span></span>
          </h1>
          <p class="subtitle">你會跟隨誰？</p>
        </header>
      </div>

      <div class="card id-card abs" aria-hidden="true"></div>

      <h2 class="cs-head id-head abs">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#ec8c7b"><ellipse cx="16" cy="21.5" rx="7.6" ry="6.4"/><ellipse cx="7" cy="13.5" rx="3.1" ry="3.9" transform="rotate(-18 7 13.5)"/><ellipse cx="12.4" cy="7.8" rx="3.1" ry="4" transform="rotate(-6 12.4 7.8)"/><ellipse cx="19.6" cy="7.8" rx="3.1" ry="4" transform="rotate(6 19.6 7.8)"/><ellipse cx="25" cy="13.5" rx="3.1" ry="3.9" transform="rotate(18 25 13.5)"/></g></svg>
        <span>你的身份</span>
        <svg class="id-ticks" viewBox="0 0 20 28" aria-hidden="true"><path d="M5 6l8-3M4 14h10M5 22l8 3" stroke="#f0c75e" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      </h2>
      <p class="id-sub id-sub--pre abs" data-for="pre">準備好了嗎？<br />點擊下方按鈕，揭曉你的秘密身份！</p>
      <p class="id-sub id-sub--shown abs" data-for="shown">這就是你的身份！</p>
      <p class="id-sub id-sub--shown abs" data-for="wait">你的身份已確認，請保密喔！</p>

      <!-- the circle: moves/shrinks between the pre and shown layouts -->
      <div class="id-box abs" id="box" aria-hidden="true">
        <i class="id-ground"></i>
        <div class="id-hero"></div>
        <svg class="id-tuft id-tuft--l" viewBox="0 0 24 18" aria-hidden="true"><g fill="#8db07c"><ellipse cx="5.5" cy="12" rx="2.6" ry="5.4" transform="rotate(-28 5.5 12)"/><ellipse cx="12" cy="9.5" rx="2.8" ry="7.5"/><ellipse cx="18.5" cy="12" rx="2.6" ry="5.4" transform="rotate(28 18.5 12)"/></g></svg>
        <svg class="id-tuft id-tuft--r" viewBox="0 0 24 18" aria-hidden="true"><g fill="#8db07c"><ellipse cx="5.5" cy="12" rx="2.6" ry="5.4" transform="rotate(-28 5.5 12)"/><ellipse cx="12" cy="9.5" rx="2.8" ry="7.5"/><ellipse cx="18.5" cy="12" rx="2.6" ry="5.4" transform="rotate(28 18.5 12)"/></g></svg>
        <svg class="id-star id-star--r" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 5.6 4.9 9.6 10.5 10.5-5.6.9-9.6 4.9-10.5 10.5C11.1 16.9 7.1 12.9 1.5 12 7.1 11.1 11.1 7.1 12 1.5Z" fill="#f3c955"/></svg>
        <svg class="id-star id-star--l" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 5.6 4.9 9.6 10.5 10.5-5.6.9-9.6 4.9-10.5 10.5C11.1 16.9 7.1 12.9 1.5 12 7.1 11.1 11.1 7.1 12 1.5Z" fill="#f3c955"/></svg>
        <svg class="id-dash id-dash--l" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l6 3M3 18l8-1.5" stroke="#7fa36f" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
        <svg class="id-dash id-dash--r" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 9l-6 3M21 18l-8-1.5" stroke="#7fa36f" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
        <div class="id-sil" id="sil"><i class="id-sil__q" lang="en">?</i></div>
        <div class="id-spr" id="spr"><img class="f1" id="f1" alt="" draggable="false" /><img class="f2" id="f2" alt="" draggable="false" /></div>
        <div class="id-burst" id="burst"></div>
      </div>

      <!-- role (filled in by identity.js only after 揭曉) -->
      <div class="id-role abs" data-for="shown" aria-live="polite">
        <p class="id-pill" id="pill"><span class="id-pill__icon" id="pillIcon" aria-hidden="true"></span><span class="id-pill__name" id="roleName"></span><span class="id-pill__leader" id="roleLeader" hidden></span></p>
        <div class="id-desc" id="desc"><p class="id-sup" id="sup" hidden><span class="id-sup__img"><img id="supImg" alt="" draggable="false" /></span><span id="supText"></span></p><p id="descText"></p><p class="id-rule" id="ruleText" hidden></p></div>
      </div>

      <div class="id-waitbox abs" data-for="wait">
        <p class="id-wait">等待主持人開始下一步<span class="id-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
        <p class="id-hint">請看 TV，留意主持人的指示！</p>
      </div>

      <button class="btn cs-join id-btn id-btn--reveal abs" id="reveal" type="button" data-for="pre">
        <span class="btn__label">揭曉我的身份</span>
        <svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12h19M14 4.5l7.5 7.5-7.5 7.5" /></svg>
      </button>
      <button class="btn cs-join id-btn id-btn--ok abs" id="ok" type="button" data-for="shown">
        <span class="btn__label">知道了</span>
        <svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12h19M14 4.5l7.5 7.5-7.5 7.5" /></svg>
      </button>
      <button class="btn id-again abs" id="again" type="button" data-for="wait">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>
        <span class="btn__label">再看一次身份</span>
      </button>
      <p class="id-err abs" id="err" role="alert"></p>
    </div>
  </main>
  <script>
    // The page never scrolls: block touch panning / rubber-band and pinch zoom (iOS Safari).
    (function () {
      var stop = function (e) { e.preventDefault(); };
      document.addEventListener('touchmove', stop, { passive: false });
      document.addEventListener('gesturestart', stop, { passive: false });
      document.addEventListener('gesturechange', stop, { passive: false });
      document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      var reset = function () { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); };
      window.addEventListener('scroll', reset, { passive: true });
    })();
  </script>
  <script src="../js/api.js?v=11"></script>
  <script src="../js/sprite-fit.js?v=2"></script>
  <script src="../js/identity.js?v=10"></script>
</body>
</html>
