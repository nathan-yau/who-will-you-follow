<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e9f2e3" />
  <title>回合 · Who Will You Follow? 你會跟隨誰？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&family=Chiron+GoRound+TC:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=6" />
  <link rel="stylesheet" href="../css/characters.css?v=8" />
  <link rel="stylesheet" href="../css/round.css?v=8" />
</head>
<body>
  <!-- 回合頁 (phone, while the TV shows Round 1 / 2 / 3). One page for all rounds: copy from data/texts.json (rounds.<r>).
       data-r = r1 | r2 | r3 | final (layout); data-state = loading | player | leader; data-speak = ready | live | done (發言 timer); data-vote = none | open | closed -->
  <main class="cs-app rd-app" id="app" data-state="loading" data-speak="ready" data-vote="none" data-r="r1">
    <div class="cs-stage">
      <div class="cs-bg" aria-hidden="true">
        <div class="cs-meadow"></div>
        <div class="cs-scene cs-scene--top"></div>
        <div class="cs-scene cs-scene--bottom"></div>
        <div class="cs-ground"></div>
      </div>

      <div class="cs-title">
        <header class="title-block">
          <img class="deco spark" src="../assets/img/spark-l.png?v=6" alt="" style="--x:88;--y:206;--w:29" />
          <img class="deco spark" src="../assets/img/spark-r.png?v=6" alt="" style="--x:486;--y:204;--w:26" />
          <h1 id="title" class="title" lang="en" aria-label="Who Will You Follow?">
            <span class="title__line title__line--1" aria-hidden="true"><span class="ch" style="--r:-10.9;--dy:17.6">W</span><span class="ch" style="--r:-7.6;--dy:8.5">h</span><span class="ch" style="--r:-5.3;--dy:4.1">o</span><span class="sp"> </span><span class="ch" style="--r:-1.2;--dy:0.2">W</span><span class="ch" style="--r:1.5;--dy:0.3">i</span><span class="ch" style="--r:2.7;--dy:1.1">l</span><span class="ch" style="--r:4.0;--dy:2.4">l</span><span class="sp"> </span><span class="ch" style="--r:6.9;--dy:7.0">Y</span><span class="ch" style="--r:9.4;--dy:13.1">o</span><span class="ch" style="--r:11.7;--dy:20.1">u</span></span>
            <span class="title__line title__line--2" aria-hidden="true"><span class="ch" style="--r:-2;--dy:0">F</span><span class="ch" style="--r:0;--dy:-1">o</span><span class="ch">l</span><span class="ch">l</span><span class="ch" style="--r:0;--dy:-1">o</span><span class="ch" style="--r:2;--dy:1">w</span><span class="ch" style="--r:8;--dy:3">?</span></span>
          </h1>
          <p class="subtitle">你會跟隨誰？</p>
        </header>
      </div>

      <div class="card rd-card abs" aria-hidden="true"></div>

      <p class="rd-tag abs" id="tag" lang="en"></p>
      <p class="rd-pill abs" id="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.4" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 9.2v4.4l2.8 1.8M9.6 2.6h4.8M18.6 5.6l1.6 1.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="pillText">準備中</span></p>

      <h2 class="rd-title abs"><span id="rdTitle"></span><svg class="rd-brush" viewBox="0 0 160 22" preserveAspectRatio="none" aria-hidden="true"><path d="M4 11.5C30 6 70 4.6 104 5.2c20 .4 38 1.6 52 3.6 2.4.4 2.2 3.6-.2 3.8-16 1-30 1.4-46 2.2-34 1.6-68 3.6-102 6.6-4.6.4-6-8.8-3.8-9.9Z" fill="#f5b3b0" opacity="0.92"/><path d="M14 16.5c30-2.6 64-4 96-4.4" stroke="#f9cfcc" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></h2>
      <div class="rd-clock abs" aria-live="off"><b id="clock" lang="en">--:--</b><span id="clockLabel">剩餘時間</span></div>
      <p class="rd-desc abs" id="desc"></p>

      <!-- Round 2: 平民 / supporters -> 神秘描述; leaders -> 「你的詞語」 (only their own word; true and fake identical layout) -->
      <div class="rd-myst abs" id="myst" data-r="r2">
        <span class="rd-myst__ic" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 4.5h10l6 6v16a1.5 1.5 0 0 1-1.5 1.5h-14.5a1.5 1.5 0 0 1-1.5-1.5v-20.5a1.5 1.5 0 0 1 1.5-1.5Z" fill="#fff" stroke="#4f6e48" stroke-width="2.2" stroke-linejoin="round"/><path d="M19 4.5v6h6" fill="none" stroke="#4f6e48" stroke-width="2.2" stroke-linejoin="round"/><path d="M11.5 15.5h9M11.5 19.5h9M11.5 23.5h6" stroke="#4f6e48" stroke-width="2.2" stroke-linecap="round"/></svg></span>
        <p class="rd-myst__title" id="mystTitle">神秘描述</p>
        <svg class="rd-myst__leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-7 5-12 14-13-1 8-6 13-14 13Z" fill="#9cc08a"/><path d="M5 19l8-8" stroke="#6f9a5e" stroke-width="1.6" stroke-linecap="round"/></svg>
        <p class="rd-myst__word" id="mystWord" hidden></p>
        <p class="rd-myst__text" id="mystText"></p>
      </div>

      <!-- Round 3: 解鎖進度 + the current question (admin 「Round 3 問答」) -->
      <div class="rd-prog abs" id="prog" data-r="r3">
        <p class="rd-prog__label"><span id="progLabel">解鎖進度</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-7 5-12 14-13-1 8-6 13-14 13Z" fill="#9cc08a"/></svg></p>
        <div class="rd-prog__dots" id="progDots"></div>
        <p class="rd-prog__note" id="progNote"></p>
      </div>
      <div class="rd-quiz abs" id="quiz" data-r="r3" data-q="wait">
        <p class="rd-quiz__badge" id="qBadge">問題 1 / 5</p>
        <p class="rd-quiz__st" id="qStatus"></p>
        <span class="rd-quiz__q" aria-hidden="true" lang="en">Q</span>
        <p class="rd-quiz__text" id="qText"></p>
        <div class="rd-opts" id="opts"></div>
        <div class="rd-clue" id="clue"><p class="rd-clue__title"><span id="clueTitle">最後的線索</span><b id="clueBadge">已解鎖！</b></p><p class="rd-clue__text" id="clueText"></p></div>
      </div>

      <!-- 最終揭曉 (TV screen 'final'): 「請看 TV」 + what the host has revealed so far (server sends only flipped roles) -->
      <div class="rd-fin abs" id="fin" data-r="final" aria-live="polite"></div>

      <!-- 結局 (TV screen 'ending'): same result as the TV + this phone's own line (who YOU followed / your own leader result) -->
      <div class="rd-end abs" id="end" data-r="ending" aria-live="polite">
        <div class="rd-end__m"><p class="rd-end__ml"><span id="endLabel">跟隨真正領袖</span><b id="endCount" lang="en"></b></p>
          <div class="rd-end__bar"><i id="endFill"></i><span class="rd-end__tg" id="endTg"><em id="endTgText"></em></span></div></div>
        <div class="rd-end__me" id="endMe"><span class="rd-end__mc" id="endMeC"></span><p id="endMeText"></p></div>
        <div class="rd-end__ls" id="endLs"></div>
        <p class="rd-end__thx" id="endThx"></p>
      </div>
      <!-- 結局 while the TV is still counting (no result on the phone until then) -->
      <div class="rd-endw abs" id="endWait" data-r="ending" aria-hidden="true">
        <div class="rd-endw__lambs"><span class="rd-endw__l"><img class="f1" alt="" src="../assets/tv/lamb-walk1.webp?v=1"><img class="f2" alt="" src="../assets/tv/lamb-walk2.webp?v=1"></span><span class="rd-endw__l"><img class="f1" alt="" src="../assets/tv/lamb-walk1.webp?v=1"><img class="f2" alt="" src="../assets/tv/lamb-walk2.webp?v=1"></span></div>
        <p class="rd-endw__dots"><i></i><i></i><i></i></p>
      </div>

      <!-- the leaders (same slot order as the TV cards), peeking out of paw-print pots -->
      <div class="rd-scene abs" aria-hidden="true">
        <svg class="rd-hills" viewBox="0 0 474 200" preserveAspectRatio="none"><path d="M60 200C70 80 150 14 240 14S410 80 420 200Z" fill="#e4eed8"/><g fill="#cfe1bb"><circle cx="40" cy="120" r="46"/><circle cx="96" cy="84" r="50"/><circle cx="150" cy="112" r="40"/><circle cx="330" cy="110" r="42"/><circle cx="382" cy="80" r="50"/><circle cx="440" cy="118" r="46"/></g><g fill="#bdd5a5"><circle cx="20" cy="160" r="40"/><circle cx="120" cy="150" r="36"/><circle cx="240" cy="166" r="44"/><circle cx="356" cy="152" r="38"/><circle cx="458" cy="160" r="40"/><rect x="0" y="150" width="474" height="50"/></g><g fill="#e9f2df"><circle cx="86" cy="70" r="3.5"/><circle cx="392" cy="66" r="3"/><circle cx="150" cy="100" r="2.5"/></g></svg>
        <svg class="rd-tick rd-tick--l" viewBox="0 0 24 24"><path d="M6 4l4 6M14 3l-1 6M2 12l6 1" stroke="#5e4a36" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        <svg class="rd-tick rd-tick--r" viewBox="0 0 24 24"><path d="M18 4l-4 6M10 3l1 6M22 12l-6 1" stroke="#5e4a36" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        <div class="rd-row" id="row"></div>
        <i class="rd-ground"></i>
      </div>
      <template id="potTpl"><svg class="rd-pot__svg" viewBox="0 0 90 72"><path d="M9 17h72l-7.4 50.6a4 4 0 0 1-4 3.4H20.4a4 4 0 0 1-4-3.4Z" fill="#d6ad7a" stroke="#6b4a2e" stroke-width="2.4" stroke-linejoin="round"/><rect x="2.5" y="2.5" width="85" height="17" rx="4.5" fill="#dfb985" stroke="#6b4a2e" stroke-width="2.4"/><g fill="#f4e6c8"><ellipse cx="45" cy="47" rx="8.4" ry="7"/><ellipse cx="34.6" cy="38.4" rx="3.3" ry="4.1" transform="rotate(-18 34.6 38.4)"/><ellipse cx="40.6" cy="32.6" rx="3.3" ry="4.2" transform="rotate(-6 40.6 32.6)"/><ellipse cx="49.4" cy="32.6" rx="3.3" ry="4.2" transform="rotate(6 49.4 32.6)"/><ellipse cx="55.4" cy="38.4" rx="3.3" ry="4.1" transform="rotate(18 55.4 38.4)"/></g></svg></template>

      <!-- 小提示 -->
      <div class="rd-tip abs" id="tipBox">
        <svg class="rd-bulb" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5a9 9 0 0 0-5.4 16.2c1 .8 1.6 1.9 1.6 3.1v.7h7.6v-.7c0-1.2.6-2.3 1.6-3.1A9 9 0 0 0 16 3.5Z" fill="#f6c44f"/><path d="M12.4 26.4h7.2M13.4 29h5.2" stroke="#8c6a3e" stroke-width="2" stroke-linecap="round"/><path d="M11.6 11.4a5 5 0 0 1 3.6-3.4" stroke="#fff6d6" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <p class="rd-tip__title" id="tipTitle">小提示</p>
        <p class="rd-tip__text" id="tip"></p>
        <span class="rd-cat"><img class="f1" src="../assets/characters/character_01/stale1.webp?v=6" alt="" draggable="false" /><img class="f2" src="../assets/characters/character_01/stale2.webp?v=6" alt="" draggable="false" /></span>
        <svg class="rd-q" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3C10.6 3 4 9.4 4 17.4c0 4.6 2.2 8.6 5.8 11.2L8 36l8-4.6c1.3.3 2.6.4 4 .4 9.4 0 16-6.4 16-14.4S29.4 3 20 3Z" fill="#fff" stroke="#5e4a36" stroke-width="2.2" stroke-linejoin="round"/><path d="M15.6 13.6c.4-2.4 2.2-3.8 4.6-3.8 2.6 0 4.4 1.6 4.4 3.8 0 3.2-4.4 3.2-4.4 6.4" fill="none" stroke="#5e4a36" stroke-width="2.4" stroke-linecap="round"/><circle cx="20.2" cy="24.6" r="1.7" fill="#5e4a36"/></svg>
        <svg class="rd-dash" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l6 3M3 18l8-1.5" stroke="#7fa36f" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      </div>

      <!-- players: 前往投票 (enabled only while this round's vote is open; never auto-jumps) -->
      <button class="btn cs-join rd-btn abs" id="go" type="button" data-for="player" disabled>
        <span class="btn__label" id="goLabel">等待投票開始</span>
        <svg class="btn__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12h19M14 4.5l7.5 7.5-7.5 7.5" /></svg>
      </button>
      <!-- leaders: their own follower count (a number only), once this round's vote has closed -->
      <div class="rd-follow abs" id="follow" data-for="leader" aria-live="polite">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#ec8c7b"><ellipse cx="16" cy="21.5" rx="7.6" ry="6.4"/><ellipse cx="7" cy="13.5" rx="3.1" ry="3.9" transform="rotate(-18 7 13.5)"/><ellipse cx="12.4" cy="7.8" rx="3.1" ry="4" transform="rotate(-6 12.4 7.8)"/><ellipse cx="19.6" cy="7.8" rx="3.1" ry="4" transform="rotate(6 19.6 7.8)"/><ellipse cx="25" cy="13.5" rx="3.1" ry="3.9" transform="rotate(18 25 13.5)"/></g></svg>
        <span class="rd-follow__label" id="followLabel">跟隨你的人數</span>
        <span class="rd-follow__val" id="followVal"></span>
      </div>
      <a class="rd-again abs" id="again" href="../identity/#card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg><span id="againText">再看一次身份</span></a>
      <p class="rd-err abs" id="err" role="alert"></p>
    </div>
  </main>
  <script>
    // The page never scrolls: block touch panning / rubber-band and pinch zoom (iOS Safari).
    (function () {
      var stop = function (e) { e.preventDefault(); };
      document.addEventListener('touchmove', stop, { passive: false });
      document.addEventListener('gesturestart', stop, { passive: false });
      document.addEventListener('gesturechange', stop, { passive: false });
      document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      var reset = function () { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); };
      window.addEventListener('scroll', reset, { passive: true });
    })();
  </script>
  <script src="../js/api.js?v=10"></script>
  <script src="../js/sprite-fit.js?v=2"></script>
  <script src="../js/round.js?v=10"></script>
</body>
</html>
