<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e9f2e3" />
  <title>等待開始 · Who Will You Follow? 你會跟隨誰？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&family=Chiron+GoRound+TC:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=6" />
  <link rel="stylesheet" href="../css/characters.css?v=8" />
  <link rel="stylesheet" href="../css/lobby.css?v=10" />
</head>
<body>
  <main class="cs-app">
    <div class="cs-stage">
      <!-- scenery: page-1 artwork (top), its bottom bushes, meadow to the physical bottom -->
      <div class="cs-bg" aria-hidden="true">
        <div class="cs-meadow"></div>
        <div class="cs-scene cs-scene--top"></div>
        <div class="cs-scene cs-scene--bottom"></div>
        <div class="cs-ground"></div>
      </div>

      <div class="cs-title">
        <header class="title-block">
          <img class="deco spark" src="../assets/img/spark-l.png?v=6" alt="" style="--x:88;--y:206;--w:29" />
          <img class="deco spark" src="../assets/img/spark-r.png?v=6" alt="" style="--x:486;--y:204;--w:26" />
          <h1 id="title" class="title" lang="en" aria-label="Who Will You Follow?">
            <span class="title__line title__line--1" aria-hidden="true"><span class="ch" style="--r:-10.9;--dy:17.6">W</span><span class="ch" style="--r:-7.6;--dy:8.5">h</span><span class="ch" style="--r:-5.3;--dy:4.1">o</span><span class="sp"> </span><span class="ch" style="--r:-1.2;--dy:0.2">W</span><span class="ch" style="--r:1.5;--dy:0.3">i</span><span class="ch" style="--r:2.7;--dy:1.1">l</span><span class="ch" style="--r:4.0;--dy:2.4">l</span><span class="sp"> </span><span class="ch" style="--r:6.9;--dy:7.0">Y</span><span class="ch" style="--r:9.4;--dy:13.1">o</span><span class="ch" style="--r:11.7;--dy:20.1">u</span></span>
            <span class="title__line title__line--2" aria-hidden="true"><span class="ch" style="--r:-2;--dy:0">F</span><span class="ch" style="--r:0;--dy:-1">o</span><span class="ch">l</span><span class="ch">l</span><span class="ch" style="--r:0;--dy:-1">o</span><span class="ch" style="--r:2;--dy:1">w</span><span class="ch" style="--r:8;--dy:3">?</span></span>
          </h1>
          <p class="subtitle">你會跟隨誰？</p>
        </header>
      </div>

      <div class="card lb-card abs" aria-hidden="true"></div>

      <h2 class="lb-hello abs">歡迎你，</h2>
      <p class="lb-name abs" id="name">
        <svg class="lb-leaf" viewBox="0 0 30 22" aria-hidden="true"><path fill="#8ab27a" d="M29 16.5C23 21 14.5 20.6 10.5 14.6 16.6 10.8 24.4 11.4 29 16.5Z"/><path fill="#8ab27a" d="M17.5 11.6C11 12.6 5 8.6 4 1.6 11 1.6 16.5 5.6 17.5 11.6Z"/><path d="M28 16.3C20 14.6 13 12.5 6.5 3.4" stroke="#fdfaf1" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
        <span><span id="nameText" lang="en"></span>！</span>
        <svg class="lb-leaf lb-leaf--r" viewBox="0 0 30 22" aria-hidden="true"><path fill="#8ab27a" d="M29 16.5C23 21 14.5 20.6 10.5 14.6 16.6 10.8 24.4 11.4 29 16.5Z"/><path fill="#8ab27a" d="M17.5 11.6C11 12.6 5 8.6 4 1.6 11 1.6 16.5 5.6 17.5 11.6Z"/><path d="M28 16.3C20 14.6 13 12.5 6.5 3.4" stroke="#fdfaf1" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
      </p>

      <div class="hero lb-hero abs" aria-hidden="true"></div>
      <svg class="tuft lb-tuft--l abs" viewBox="0 0 24 18" aria-hidden="true"><g fill="#8db07c"><ellipse cx="5.5" cy="12" rx="2.6" ry="5.4" transform="rotate(-28 5.5 12)"/><ellipse cx="12" cy="9.5" rx="2.8" ry="7.5"/><ellipse cx="18.5" cy="12" rx="2.6" ry="5.4" transform="rotate(28 18.5 12)"/></g></svg>
      <svg class="tuft lb-tuft--r abs" viewBox="0 0 24 18" aria-hidden="true"><g fill="#8db07c"><ellipse cx="5.5" cy="12" rx="2.6" ry="5.4" transform="rotate(-28 5.5 12)"/><ellipse cx="12" cy="9.5" rx="2.8" ry="7.5"/><ellipse cx="18.5" cy="12" rx="2.6" ry="5.4" transform="rotate(28 18.5 12)"/></g></svg>
      <div class="sprite lb-sprite abs" id="sprite">
        <img class="f1" id="f1" alt="" draggable="false" />
        <img class="f2" id="f2" alt="" draggable="false" />
      </div>
      <!-- local tap feedback on the player's own bubble (phone only, never sent anywhere) -->
      <div class="lb-fx abs" id="tapFx" aria-hidden="true"><b class="lb-fx__ring"></b><i></i><i></i><i></i><i></i><i></i><i></i></div>

      <section class="ready lb-info abs" aria-live="polite">
        <div class="lb-group abs" aria-hidden="true">
          <img class="lb-g lb-g--b" src="../assets/characters/character_02/stale1.webp?v=6" alt="" draggable="false" />
          <img class="lb-g lb-g--c" src="../assets/characters/character_01/stale1.webp?v=6" alt="" draggable="false" />
          <img class="lb-g lb-g--d" src="../assets/characters/character_03/stale1.webp?v=6" alt="" draggable="false" />
        </div>
        <p class="lb-wait abs" id="wait">等待其他玩家加入<span class="lb-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
        <p class="lb-hint abs" id="hint">當所有人準備好後，遊戲就會開始！</p>
      </section>

      <p class="lb-label abs">目前人數</p>
      <p class="lb-count abs" id="count" aria-live="polite"><b id="joined">–</b></p>
      <div class="lb-row abs" id="playerDots" aria-hidden="true"></div>

      <svg class="lb-sign abs" viewBox="0 -12 100 116" aria-hidden="true">
        <g fill="#8db07c"><ellipse cx="22" cy="95" rx="3" ry="7" transform="rotate(-30 22 95)"/><ellipse cx="28" cy="93" rx="3" ry="8.5"/><ellipse cx="34" cy="95" rx="3" ry="7" transform="rotate(30 34 95)"/><ellipse cx="66" cy="95" rx="3" ry="7" transform="rotate(-30 66 95)"/><ellipse cx="72" cy="93" rx="3" ry="8.5"/><ellipse cx="78" cy="95" rx="3" ry="7" transform="rotate(30 78 95)"/></g>
        <path d="M14 100h72" stroke="#9cbf8a" stroke-width="2.2" stroke-linecap="round"/>
        <rect x="45" y="56" width="10" height="44" rx="2.5" fill="#b8875a" stroke="#5e3f26" stroke-width="2.4"/>
        <g transform="rotate(-3 50 46)">
          <rect x="5" y="31" width="90" height="33" rx="6" fill="#d9a66d" stroke="#5e3f26" stroke-width="2.6"/>
          <path d="M11 37h16M72 58h16" stroke="#c18e58" stroke-width="1.6" stroke-linecap="round"/>
          <text x="50" y="53" text-anchor="middle" font-family="'Chiron GoRound TC', 'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700" font-size="14.5" letter-spacing="0.5" fill="#4f321c">快已準了！</text>
        </g>
        <!-- chick sitting on the board -->
        <g class="lb-chick"><g transform="translate(40 33) scale(1.5) translate(-43 -33)">
          <path d="M33 33c-1.5-9 3.5-17 12.5-17 7.5 0 12 5.5 12 12 0 2.4-.5 4-1.4 5.4Z" fill="#f4c35a" stroke="#5e3f26" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M48 26c3.5-.4 6 1.4 6.4 4.4-3.4.7-5.6-.6-6.4-4.4Z" fill="#e9a93f"/>
          <path d="M45 10.5c.6-3 2.6-4.5 4.4-4M47 11.5c2-2.2 4.6-2.6 6.2-1.6" stroke="#5e3f26" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <circle cx="40.5" cy="22.5" r="1.9" fill="#3b2a1b"/>
          <path d="M33.8 24.3l-5 1.8 4.8 1.8Z" fill="#ef9a4a" stroke="#5e3f26" stroke-width="1.4" stroke-linejoin="round"/>
          <ellipse cx="43" cy="27" rx="2.3" ry="1.4" fill="#f4a08a" opacity="0.8"/>
        </g></g>
        <path d="M80 15l5-6M86 22l7-2.5" stroke="#3b2a1b" stroke-width="2.4" stroke-linecap="round"/>
      </svg>

      <button type="button" class="btn lb-act lb-act--dodge abs" id="dodge" data-action="dodge">
        <svg class="lb-act__icon" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 4.5c4.6 3 9.2 4.2 14 4.4.4 12.8-4.4 22.4-14 26.8C10.4 31.3 5.6 21.7 6 8.9c4.8-.2 9.4-1.4 14-4.4Z" fill="#cfe2bd" stroke="#5e3f26" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M20 4.5c4.6 3 9.2 4.2 14 4.4.4 12.8-4.4 22.4-14 26.8Z" fill="#a9c995"/>
          <path d="M20 4.5c4.6 3 9.2 4.2 14 4.4.4 12.8-4.4 22.4-14 26.8C10.4 31.3 5.6 21.7 6 8.9c4.8-.2 9.4-1.4 14-4.4Z" fill="none" stroke="#5e3f26" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M20 26.5s-6.5-3.9-6.5-8.3c0-2.2 1.6-3.7 3.5-3.7 1.4 0 2.4.8 3 1.8.6-1 1.6-1.8 3-1.8 1.9 0 3.5 1.5 3.5 3.7 0 4.4-6.5 8.3-6.5 8.3Z" fill="#f1a493" stroke="#5e3f26" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span class="btn__label">避開啊</span>
      </button>
      <button type="button" class="btn lb-act lb-act--dash abs" id="dash" data-action="dash">
        <svg class="lb-act__icon lb-act__paw" viewBox="0 0 32 32" aria-hidden="true"><g fill="#fff"><ellipse cx="16" cy="21.5" rx="7.6" ry="6.4"/><ellipse cx="7" cy="13.5" rx="3.1" ry="3.9" transform="rotate(-18 7 13.5)"/><ellipse cx="12.4" cy="7.8" rx="3.1" ry="4" transform="rotate(-6 12.4 7.8)"/><ellipse cx="19.6" cy="7.8" rx="3.1" ry="4" transform="rotate(6 19.6 7.8)"/><ellipse cx="25" cy="13.5" rx="3.1" ry="3.9" transform="rotate(18 25 13.5)"/></g></svg>
        <span class="btn__label">衝過去</span>
      </button>
    </div>
  </main>
  <script>
    // The page never scrolls: block touch panning / rubber-band and pinch zoom (iOS Safari).
    (function () {
      var stop = function (e) { e.preventDefault(); };
      document.addEventListener('touchmove', stop, { passive: false });
      document.addEventListener('gesturestart', stop, { passive: false });
      document.addEventListener('gesturechange', stop, { passive: false });
      document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      var reset = function () { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); };
      window.addEventListener('scroll', reset, { passive: true });
    })();
  </script>
  <script src="../js/api.js?v=11"></script>
  <script src="../js/rt.js?v=1"></script>
  <script src="../js/lobby.js?v=16"></script>
</body>
</html>
